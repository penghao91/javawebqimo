# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/questionnaire?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.questionnaire.model
mybatis.configuration.map-underscore-to-camel-case=true

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Logging
logging.level.com.questionnaire.dao=DEBUG
logging.level.org.springframework.security=DEBUG

# Session Configuration
server.servlet.session.timeout=30m